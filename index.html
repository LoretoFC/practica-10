<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Práctica 10 | Francisco Castellanos Loreto</title>

    <!-- Importación de la fuente Roboto desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Roboto", sans-serif;
        background-color: #0a0b0d;
        color: #e6edf3;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
      }

      .tarjeta-resultado {
        background-color: #111318;
        padding: 40px;
        border-radius: 12px;
        border: 1px solid #21262d;
        border-top: 3px solid #d90429;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        font-size: 24px;
        color: #e6edf3;
        transition: border-color 0.2s ease;
      }

      .tarjeta-resultado:hover {
        border-color: rgba(217, 4, 41, 0.4);
      }

      .valor-negrita {
        font-weight: 700;
        color: #ff103f; /* Rojo intenso para resaltar los valores */
      }
    </style>
  </head>
  <body>
    <script>
      let a = prompt("Ingrese el valor de a: ");
      let b = prompt("Ingrese el valor de b: ");
      let resultado = parseInt(a) + parseInt(b);

      console.log(resultado);

      document.write(`
        <div class="tarjeta-resultado">
          El resultado de la suma de: 
          <span class="valor-negrita">${a}</span> 
          más 
          <span class="valor-negrita">${b}</span> 
          es:  
          <span class="valor-negrita">${resultado}</span>
        </div>
      `);
    </script>
  </body>
</html>
