<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Práctica 10 - Suma</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Roboto", sans-serif;
        background-color: #121316;
        color: #e1e4e8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      .contenedor-suma {
        background-color: #1c1e24;
        border: 1px solid #2d3139;
        border-radius: 8px;
        padding: 30px 40px;
        text-align: center;
        min-width: 280px;
      }

      .titulo-practica {
        font-size: 14px;
        color: #8b949e;
        margin-bottom: 16px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .operacion {
        font-size: 26px;
        color: #ffffff;
        margin-bottom: 14px;
      }

      .operador {
        color: #e63946;
        font-weight: 700;
        margin: 0 6px;
      }

      .linea {
        border: 0;
        border-top: 1px solid #2d3139;
        margin: 14px 0;
      }

      .total {
        font-size: 32px;
        font-weight: 700;
        color: #e63946;
      }
    </style>
  </head>
  <body>
    <script>
      let a = prompt("Ingrese el valor de a: ");
      let b = prompt("Ingrese el valor de b: ");
      let resultado = parseInt(a) + parseInt(b);

      console.log(resultado);

      document.write(`
        <div class="contenedor-suma">
          <div class="titulo-practica">Resultado de la Operación</div>
          <div class="operacion">
            ${a} <span class="operador">+</span> ${b} <span class="operador">=</span>
          </div>
          <hr class="linea">
          <div class="total">${resultado}</div>
        </div>
      `);
    </script>
  </body>
</html>
