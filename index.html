<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Práctica 10 | Francisco Castellanos Loreto</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-core: #090a0d;
        --card-bg: #111318;
        --card-border: #1f2430;
        --red-accent: #e60026;
        --red-glow: rgba(230, 0, 38, 0.25);
        --text-main: #f1f5f9;
        --text-muted: #8b95a5;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Roboto', sans-serif;
        background-color: var(--bg-core);
        color: var(--text-main);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .calc-console {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        width: 100%;
        max-width: 440px;
        overflow: hidden;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
      }

      .console-topbar {
        background: #171b23;
        border-bottom: 1px solid var(--card-border);
        padding: 12px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .window-dots {
        display: flex;
        gap: 6px;
      }

      .w-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #2b313e;
      }

      .w-dot.red { background: #ff5f56; }

      .console-tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        color: var(--text-muted);
        letter-spacing: 0.5px;
      }

      .console-body {
        padding: 26px 22px;
      }

      .meta-student {
        border-bottom: 1px solid var(--card-border);
        padding-bottom: 14px;
        margin-bottom: 20px;
      }

      .meta-student p {
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .meta-student strong {
        color: #ffffff;
        font-weight: 600;
      }

      .operation-grid {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
        background: #090a0e;
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 20px;
        text-align: center;
      }

      .val-box {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .val-label {
        font-size: 0.72rem;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.5px;
      }

      .val-number {
        font-family: 'JetBrains Mono', monospace;
        font-size: 1.5rem;
        font-weight: 700;
        color: #ffffff;
      }

      .operator-sym {
        font-family: 'JetBrains Mono', monospace;
        font-size: 1.4rem;
        color: var(--red-accent);
        font-weight: 800;
      }

      .result-banner {
        background: rgba(230, 0, 38, 0.08);
        border: 1px solid rgba(230, 0, 38, 0.3);
        border-radius: 10px;
        padding: 16px;
        text-align: center;
      }

      .result-title {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--red-accent);
        font-weight: 700;
        margin-bottom: 4px;
      }

      .result-value {
        font-family: 'JetBrains Mono', monospace;
        font-size: 2.3rem;
        font-weight: 800;
        color: #ffffff;
        text-shadow: 0 0 16px var(--red-glow);
      }
    </style>
  </head>
  <body>
    <script>
      let a = prompt("Ingrese el valor de a: ");
      let b = prompt("Ingrese el valor de b: ");
      let resultado = parseInt(a) + parseInt(b);

      console.log("Resultado de la suma:", resultado);

      document.write(`
        <div class="calc-console">
          <div class="console-topbar">
            <div class="window-dots">
              <span class="w-dot red"></span>
              <span class="w-dot"></span>
              <span class="w-dot"></span>
            </div>
            <span class="console-tag">JS_ARITHMETIC_V10</span>
          </div>

          <div class="console-body">
            <div class="meta-student">
              <p>Módulo: <strong>Operadores Aritméticos</strong></p>
              <p>Alumno: <strong>Francisco Castellanos Loreto (23320783)</strong></p>
            </div>

            <div class="operation-grid">
              <div class="val-box">
                <span class="val-label">Operando 1</span>
                <span class="val-number">${a}</span>
              </div>
              <div class="operator-sym">+</div>
              <div class="val-box">
                <span class="val-label">Operando 2</span>
                <span class="val-number">${b}</span>
              </div>
            </div>

            <div class="result-banner">
              <div class="result-title">Suma Total</div>
              <div class="result-value">${resultado}</div>
            </div>
          </div>
        </div>
      `);
    </script>
  </body>
</html>
